<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Summary</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-primary">
            <div class="container-fluid">
                <div class="welcome-text text-white">
                    Welcome, {{ session['fullname'] }}!
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                    <ul class="navbar-nav d-flex align-items-center">
                        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('user_dashboard') }}">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('scores') }}">Scores</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('user_summary') }}">Summary</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('index') }}">Logout</a></li>
                    </ul>
                    <form class="d-flex ms-3">
                        <input class="form-control me-2" type="search" placeholder="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    </div>
    <h2 class="text-center mt-3">User Summary - Quiz Performance</h2>

    {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
    {% else %}
        <div style="text-align: center; margin-top: 20px;">
            <img src="{{ chart_url }}" alt="User Quiz Summary" style="width: 80%; height: auto;">
        </div>
    {% endif %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
